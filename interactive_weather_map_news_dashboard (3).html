<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Weather Map Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #030712; color: white; }
        .glass-dark { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #map { height: 100vh; width: 100%; filter: invert(90%) hue-rotate(180deg) brightness(0.7) contrast(1.2); }
        .slide-panel { transition: transform 0.3s ease-in-out; }
        .modal { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden">

    <div id="map"></div>

    <!-- Search Toggle -->
    <button onclick="toggleSidebar()" class="absolute top-6 left-6 z-[1000] glass-dark p-4 rounded-2xl hover:bg-indigo-600 transition shadow-xl">
        <i class="ph ph-magnifying-glass text-2xl"></i>
    </button>

    <!-- Sidebar -->
    <div id="sidebar" class="slide-panel absolute top-0 left-0 h-full w-96 glass-dark z-[2000] p-6 -translate-x-full shadow-2xl flex flex-col border-r border-gray-800 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-indigo-400">Explore</h1>
            <button onclick="toggleSidebar()"><i class="ph ph-x text-xl hover:text-indigo-400"></i></button>
        </div>
        
        <input type="text" id="cityInput" placeholder="Enter city name..." class="w-full bg-gray-900 px-4 py-3 rounded-xl border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4">
        <button onclick="handleSearch()" class="w-full bg-indigo-600 py-3 rounded-xl hover:bg-indigo-500 transition font-semibold mb-6">Search</button>

        <div id="weatherDisplay" class="hidden">
            <div onclick="openWeatherModal()" class="p-4 bg-gray-900/50 rounded-xl border border-gray-700 cursor-pointer hover:border-indigo-500 transition">
                <div id="cityName" class="text-lg font-bold text-indigo-300">--</div>
                <div id="temp" class="text-4xl font-black my-2">--°C</div>
                <div id="localTime" class="text-sm text-gray-400 font-mono">--</div>
            </div>
            <h2 class="text-indigo-400 font-semibold mt-8 mb-4 flex items-center gap-2">
                <i class="ph ph-newspaper"></i> Local News
            </h2>
            <div id="newsFeed" class="space-y-4 overflow-y-auto max-h-[400px] pr-2 custom-scrollbar">
                <!-- News items will be injected here -->
            </div>
        </div>
    </div>

    <!-- Combined Modal for Weather and News -->
    <div id="mainModal" class="hidden fixed inset-0 z-[3000] bg-black/80 flex items-center justify-center p-6 modal">
        <div class="glass-dark p-8 rounded-3xl w-full max-w-lg border border-gray-700 max-h-[80vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-400" id="modalTitle">Details</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="ph ph-x text-2xl"></i></button>
            </div>
            <div id="detailedInfo" class="space-y-4 text-gray-300">
                <!-- Data injected here -->
            </div>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    </style>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([24.7471, 90.4203], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker = null;

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function openModal() { document.getElementById('mainModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('mainModal').classList.add('hidden'); }

        async function updateDashboard(lat, lon, name = null) {
            const locationName = name || await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`).then(r => r.json()).then(d => d.city || d.locality || "Unknown");
            
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code,wind_speed_10m&hourly=precipitation_probability,temperature_2m&timezone=auto`);
            const data = await res.json();

            document.getElementById('weatherDisplay').classList.remove('hidden');
            document.getElementById('cityName').innerText = locationName;
            document.getElementById('temp').innerText = `${Math.round(data.current.temperature_2m)}°C`;
            document.getElementById('localTime').innerText = new Date().toLocaleTimeString();

            if (marker) marker.setLatLng([lat, lon]);
            else marker = L.marker([lat, lon]).addTo(map);
            map.setView([lat, lon], 10);
            
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            fetchNews(locationName);
        }

        async function fetchNews(name) {
            const feed = document.getElementById('newsFeed');
            feed.innerHTML = '<p class="text-gray-500 text-sm italic">Loading news...</p>';
            const url = `https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/search?q=${encodeURIComponent(name)}`;
            
            try {
                const res = await fetch(url).then(r => r.json());
                feed.innerHTML = res.items?.slice(0, 10).map(i => `
                    <div onclick="openNewsModal('${i.title.replace(/'/g, "\\'")}', '${i.link}')" class="p-3 bg-gray-800 rounded-lg text-sm hover:bg-gray-700 cursor-pointer transition">
                        <div class="font-bold text-gray-200 line-clamp-2">${i.title}</div>
                        <div class="text-xs text-gray-500 mt-1">${new Date(i.pubDate).toLocaleDateString()}</div>
                    </div>`).join('') || "No news found.";
            } catch (e) { feed.innerHTML = "Could not load news."; }
        }

        function openNewsModal(title, link) {
            document.getElementById('modalTitle').innerText = "News Article";
            document.getElementById('detailedInfo').innerHTML = `
                <h3 class="text-xl font-bold text-white mb-4">${title}</h3>
                <a href="${link}" target="_blank" class="block w-full text-center bg-indigo-600 py-3 rounded-xl font-semibold hover:bg-indigo-500 transition">Read Full Story</a>
            `;
            openModal();
        }

        function openWeatherModal() {
            document.getElementById('modalTitle').innerText = "Detailed Forecast";
            document.getElementById('detailedInfo').innerHTML = `<p>Forecast data for the selected location...</p>`;
            openModal();
        }

        map.on('click', (e) => updateDashboard(e.latlng.lat, e.latlng.lng));
        async function handleSearch() {
            const city = document.getElementById('cityInput').value;
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`).then(r => r.json());
            if (res.results) updateDashboard(res.results[0].latitude, res.results[0].longitude, res.results[0].name);
        }
    </script>
</body>
</html>
