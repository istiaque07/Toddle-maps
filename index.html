<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline Map App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="maplibre-gl.css">
    <script src="maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        #status {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(255,255,255,0.9); padding: 8px 14px;
            border-radius: 6px; font-size: 13px; color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #info {
            position: absolute; bottom: 10px; left: 10px; z-index: 10;
            background: rgba(255,255,255,0.9); padding: 8px 14px;
            border-radius: 6px; font-size: 12px; color: #555;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); max-width: 260px;
        }
        #search-container {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 10;
            width: 90%; max-width: 400px;
        }
        #search-box {
            display: block; width: calc(100% - 58px); padding: 10px 14px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 14px; outline: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.95);
        }
        #search-box:focus { border-color: #0078ff; }
        #search-btn {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: #0078ff; color: #fff; border: none; border-radius: 4px;
            padding: 4px 10px; cursor: pointer; font-size: 13px;
        }
        #search-btn:hover { background: #0062cc; }
        #search-results {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #fff; border: 1px solid #ccc; border-top: none;
            border-radius: 0 0 6px 6px; max-height: 200px; overflow-y: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 11;
        }
        #search-results div {
            padding: 8px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #eee;
        }
        #search-results div:hover { background: #f0f0f0; }
        #search-results div:last-child { border-bottom: none; }
        #marker-controls {
            position: absolute; bottom: 50px; left: 10px; z-index: 10;
            display: flex; gap: 6px;
        }
        #marker-controls button {
            background: rgba(255,255,255,0.9); padding: 8px 12px;
            border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
            cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #marker-controls button:hover { background: #f0f0f0; }
        #marker-controls button.active {
            background: #0078ff; color: #fff; border-color: #0078ff;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="status">Loading map...</div>
    <div id="search-container">
        <input type="text" id="search-box" placeholder="Search for a place..." autocomplete="off">
        <button id="search-btn" title="Search">Go</button>
        <div id="search-results"></div>
    </div>
    <div id="marker-controls">
        <button id="mark-btn" title="Add marker">Mark</button>
        <button id="save-btn" title="Save markers to JSON">Save</button>
        <button id="clear-btn" title="Clear all markers">Clear</button>
    </div>
    <div id="info">Zoom in on an area while online to cache tiles for offline use. Search requires an internet connection.</div>
    <script src="app.js"></script>
</body>
</html>
